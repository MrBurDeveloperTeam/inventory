<head>
    <meta charset="UTF-8">

    <title>DentaStock Pro - Advanced Inventory</title>
    <link rel="icon" type="image/png" href="/images/InventoryIcon.png">
    <link rel="apple-touch-icon" href="/images/InventoryIcon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script>
        // Catch the install prompt globally in case it fires before React components mount
        window.deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            window.deferredInstallPrompt = e;
            // Dispatch a custom event so the Header can pick it up if it's already mounted
            window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
        });
    </script>
    <style>
        .hexagon {
            aspect-ratio: 1 / 1;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%) !important;
            -webkit-clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%) !important;
            overflow: hidden;
        }

        /* Drop shadow that follows the hexagonal clip path instead of the box model */
        .hexagon-glow {
            filter: drop-shadow(0 4px 12px rgba(16, 185, 129, 0.4));
        }

        .hexagon-glow-rose {
            filter: drop-shadow(0 4px 12px rgba(244, 63, 94, 0.4));
        }

        .hexagon-glow-active {
            filter: drop-shadow(0 8px 20px rgba(5, 150, 105, 0.6));
        }

        /* Utility classes for specific scrollbar needs */
        .custom-scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* Custom landing page styles */
        .auth-primary {
            background-color: #004aad;
        }

        .auth-primary-text {
            color: #004aad;
        }
    </style>

    <link rel="stylesheet" href="/index.css">

    <!--
      Theme bootstrap — runs synchronously before React paints.
      Priority:
        1. window.__SNABBB_THEME__ — injected server-side by _worker.js
        2. snabbb-theme cookie     — set by gallery, cross-subdomain
        3. localStorage['theme']   — this app's own last-used value
        4. 'light' fallback
    -->
    <script>
      (function () {
        var VALID = { light: true, dark: true, system: true };

        function readCookie(name) {
          var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
          return m ? decodeURIComponent(m[1]) : null;
        }

        function safeGet(k) {
          try { return window.localStorage.getItem(k); } catch (e) { return null; }
        }

        function parse(raw) {
          if (!raw) return null;
          var s = String(raw).trim();
          if (s.charAt(0) === '{') {
            try {
              var p = JSON.parse(s);
              s = (p && p.state && p.state.theme) || (p && p.theme) || s;
            } catch (e) {}
          }
          s = s.trim().toLowerCase();
          return VALID[s] ? s : null;
        }

        function resolve(t) {
          if (t === 'system')
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          return t === 'dark' ? 'dark' : 'light';
        }

        var theme = parse(window.__SNABBB_THEME__)
                 || parse(readCookie('snabbb-theme'))
                 || parse(safeGet('theme'))
                 || 'light';

        var resolved = resolve(theme);
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.dataset.themePreference = theme;
        document.documentElement.classList.toggle('dark', resolved === 'dark');
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
</head>

<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
