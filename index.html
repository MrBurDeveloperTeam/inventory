    <!--
      Theme bootstrap — runs synchronously before React paints.
      Priority:
        1. window.__SNABBB_THEME__ — injected server-side by _worker.js
        2. snabbb-theme cookie     — set by gallery, cross-subdomain
        3. localStorage['theme']   — this app's own last-used value
        4. 'light' fallback
    -->
    <script>
      (function () {
        var VALID = { light: true, dark: true, system: true };

        function readCookie(name) {
          var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
          return m ? decodeURIComponent(m[1]) : null;
        }

        function safeGet(k) {
          try { return window.localStorage.getItem(k); } catch (e) { return null; }
        }

        function parse(raw) {
          if (!raw) return null;
          var s = String(raw).trim();
          if (s.charAt(0) === '{') {
            try {
              var p = JSON.parse(s);
              s = (p && p.state && p.state.theme) || (p && p.theme) || s;
            } catch (e) {}
          }
          s = s.trim().toLowerCase();
          return VALID[s] ? s : null;
        }

        function resolve(t) {
          if (t === 'system')
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          return t === 'dark' ? 'dark' : 'light';
        }

        var theme = parse(window.__SNABBB_THEME__)
                 || parse(readCookie('snabbb-theme'))
                 || parse(safeGet('theme'))
                 || 'light';

        var resolved = resolve(theme);
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.dataset.themePreference = theme;
        document.documentElement.classList.toggle('dark', resolved === 'dark');
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <style id="ls-css">html{--ls-bg:#F3F6F8;--ls-fg:#172B4D;--ls-ring:rgba(23,43,77,.12);--ls-accent:#2A9D8F;--ls-muted:#64748B}

.ls{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));text-align:center;background:var(--ls-bg);color:var(--ls-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.2;letter-spacing:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
.ls,.ls *{box-sizing:border-box;margin:0;padding:0}
.ls{padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
.ls-icon{width:min(36vw,160px);height:min(36vw,160px);max-width:none;object-fit:contain;border-radius:22%}
.ls-spinner{width:min(16vw,72px);height:min(16vw,72px);border-radius:50%;border:6px solid var(--ls-ring);border-top-color:var(--ls-accent);animation:ls-spin .8s linear infinite}
.ls-title{margin:0;padding:0;font-family:inherit;font-size:clamp(1.75rem,8vw,2.5rem);font-weight:700;line-height:1.2;letter-spacing:normal;text-transform:none}
.ls-status{margin:0;padding:0;min-height:1.5em;font-family:inherit;font-size:clamp(1rem,4vw,1.125rem);font-weight:400;line-height:1.5;letter-spacing:normal;color:var(--ls-muted)}
@keyframes ls-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ls-spinner{animation-duration:2.4s}}</style>

    };"></script>

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>

    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <script>
        // Catch the install prompt globally in case it fires before React components mount
        window.deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            window.deferredInstallPrompt = e;
            // Dispatch a custom event so the Header can pick it up if it's already mounted
            window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
        });
    </script>

            aspect-ratio: 1 / 1;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%) !important;

        }

    <script>
      // Continue the spinner rotation from where the previous page (the gallery's
      // opening splash) left off, using the shared wall clock, so the hand-off
      // between the two splashes doesn't visibly restart the animation.
      (function () {
        var d = document.createElement('style');
        d.textContent = '.ls-spinner{animation-delay:-' + (Date.now() % 800) + 'ms}';
        document.head.appendChild(d);
      })();
    </script>
