	<script type="text/javascript">

		function simulateKeyup(code) {
			var e = jQuery.Event("keyup");
			e.keyCode = code;
			jQuery('body').trigger(e);
		}
		function simulateKeydown(code) {
			var e = jQuery.Event("keydown");
			e.keyCode = code;
			jQuery('body').trigger(e);
		}

		/*
		* Prevent touch dragging from moving the page on mobile browsers.
		*/
		function preventPacCatScroll(event) {
			event.preventDefault();
		}

		/*
		* Scale the fixed 570 × 705 PAC-CAT layout so the entire
		* game always fits inside the currently visible viewport.
		*
		* The CSS panel width is 550px plus 20px horizontal padding.
		* The CSS panel height is 690px plus 15px vertical padding.
		*/
		function fitPacCatToViewport() {
			var viewport = window.visualViewport;

			var viewportWidth = viewport
				? viewport.width
				: window.innerWidth;

			var viewportHeight = viewport
				? viewport.height
				: window.innerHeight;

			var viewportLeft = viewport
				? viewport.offsetLeft
				: 0;

			var viewportTop = viewport
				? viewport.offsetTop
				: 0;

			var baseWidth = 570;
			var baseHeight = 705;
			var edgePadding = 8;

			var availableWidth = Math.max(
				viewportWidth - edgePadding * 2,
				1
			);

			var availableHeight = Math.max(
				viewportHeight - edgePadding * 2,
				1
			);

			var gameScale = Math.min(
				availableWidth / baseWidth,
				availableHeight / baseHeight,
				1
			);

			document.documentElement.style.setProperty(
				"--pac-cat-scale",
				String(gameScale)
			);

			document.documentElement.style.setProperty(
				"--pac-cat-center-x",
				viewportLeft + viewportWidth / 2 + "px"
			);

			document.documentElement.style.setProperty(
				"--pac-cat-center-y",
				viewportTop + viewportHeight / 2 + "px"
			);
		}

		$(document).ready(function () {

			/*
			* Always begin on the presentation screen without
			* gameplay direction controls.
			*/
			document.body.classList.remove(
				"game-active"
			);

			//$.mobile.loading().hide();
			loadAllSound();

			HELP_TIMER = setInterval('blinkHelp()', HELP_DELAY);

			initHome();

			fitPacCatToViewport();

			window.addEventListener(
				"resize",
				fitPacCatToViewport
			);

			window.addEventListener(
				"orientationchange",
				function () {
					/*
					* Give Safari time to finish updating its visual viewport
					* after the device changes orientation.
					*/
					setTimeout(
						fitPacCatToViewport,
						150
					);
				}
			);

			if (window.visualViewport) {
				window.visualViewport.addEventListener(
					"resize",
					fitPacCatToViewport
				);

				window.visualViewport.addEventListener(
					"scroll",
					fitPacCatToViewport
				);
			}

			document.addEventListener(
				"touchmove",
				preventPacCatScroll,
				{
					passive: false
				}
			);

			$(".sound").click(function (e) {
				e.stopPropagation();

				var sound = $(this).attr("data-sound");
				if (sound === "on") {
					$(".sound").attr("data-sound", "off");
					$(".sound").find("img").attr("src", "img/sound-off.png");
					GROUP_SOUND.mute();
				} else {
					$(".sound").attr("data-sound", "on");
					$(".sound").find("img").attr("src", "img/sound-on.png");
					GROUP_SOUND.unmute();
				}
			});

			$(".help-button, #help").click(function (e) {
				e.stopPropagation();
				if (!PACMAN_DEAD && !LOCK && !GAMEOVER) {
					if ($('#help').css("display") === "none") {
						$('#help').fadeIn("slow");
						$(".help-button").hide();
						if ($("#panel").css("display") !== "none") {
							pauseGame();
						}
					} else {
						$('#help').fadeOut("slow");
						$(".help-button").show();
					}
				}
			});

			$("#home").on("click touchstart", function (e) {
				if ($('#help').css("display") === "none") {
					e.preventDefault();
					simulateKeydown(13);
				}
			});
			$("#control-up, #control-up-second, #control-up-big").on("mousedown touchstart", function (e) {
				e.preventDefault();
				simulateKeydown(38);
				simulateKeyup(13);
			});
			$("#control-down, #control-down-second, #control-down-big").on("mousedown touchstart", function (e) {
				e.preventDefault();
				simulateKeydown(40);
				simulateKeyup(13);
			});
			$("#control-left, #control-left-big").on("mousedown touchstart", function (e) {
				e.preventDefault();
				simulateKeydown(37);
				simulateKeyup(13);
			});
			$("#control-right, #control-right-big").on("mousedown touchstart", function (e) {
				e.preventDefault();
				simulateKeydown(39);
				simulateKeyup(13);
			});


			$("body").keyup(function (e) {
				KEYDOWN = false;
			});

			$("body").keydown(function (e) {

				if (HOME) {

					initGame(true);

				} else {
					//if (!KEYDOWN) { 
					KEYDOWN = true;
					if (PACMAN_DEAD && !LOCK) {
						erasePacman();
						resetPacman();
						drawPacman();

						eraseGhosts();
						resetGhosts();
						drawGhosts();
						moveGhosts();

						blinkSuperBubbles();

					} else if (e.keyCode >= 37 && e.keyCode <= 40 && !PAUSE && !PACMAN_DEAD && !LOCK) {
						if (e.keyCode === 39) {
							movePacman(1);
						} else if (e.keyCode === 40) {
							movePacman(2);
						} else if (e.keyCode === 37) {
							movePacman(3);
						} else if (e.keyCode === 38) {
							movePacman(4);
						}
					} else if (e.keyCode === 68 && !PAUSE) {
						/*if ( $("#canvas-paths").css("display") === "none" ) { 
							$("#canvas-paths").show();
						} else { 
							$("#canvas-paths").hide();
						}*/
					} else if (e.keyCode === 80 && !PACMAN_DEAD && !LOCK) {
						if (PAUSE) {
							resumeGame();
						} else {
							pauseGame();
						}
					} else if (GAMEOVER) {
						initHome();
					}
					//}
				}
			});
		});
	</script>
